[vars]
ENVIRONMENT = "production"
# 内容安全配置
CONTENT_SECURITY_ENABLED = "true"
SIGNATURE_SECRET = "VbJBrVDVrzICYlkQgDzBVyuhOoKsWpr0BSpJAERif7Y="
ALLOWED_DOMAINS = "localhost,127.0.0.1,chigua-r2-worker.xingaikaka.workers.dev,direct"
